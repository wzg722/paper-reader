<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperMind</title>
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="stylesheet" href="style.css?v=2301">
<style>
/* 详情页视图切换 */
.view-tabs{display:flex;gap:4px;margin:16px 0 0;border-bottom:1px solid var(--border)}
.view-tabs button{padding:9px 20px;font-size:14.5px;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
.view-tabs button:hover{color:var(--primary);background:var(--primary-light)}
.view-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
/* 全文阅读排版 */
.fulltext{max-width:820px;margin:0 auto;padding:28px 8px 60px}
.fulltext .ft-title{font-size:22px;line-height:1.45;margin-bottom:6px}
.fulltext .ft-meta{color:var(--text-3);font-size:13px;margin-bottom:20px}
.fulltext h3.ft-sec{font-size:17px;margin:26px 0 10px;color:var(--text);border-left:4px solid var(--primary);padding-left:10px}
.fulltext p.ft-p{font-size:15.5px;line-height:1.9;margin-bottom:14px;text-align:justify}
.fulltext.en p.ft-p{font-family:var(--serif);color:#24292f}
.fulltext.zh p.ft-p{color:#333}
.fulltext .ft-abs{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:6px}
/* 简介（详情页完整展示，可编辑） */
.intro-full{margin-top:8px;font-size:13px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px;white-space:pre-wrap;line-height:1.7;max-width:820px}
.intro-full::before{content:'📌 ';font-weight:600}
/* 原文页：中英对照双栏 */
.ft-duo{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:14px;box-shadow:var(--shadow)}
.ft-col{max-height:72vh;overflow-y:auto;padding:18px 20px 40px;background:#fff}
.ft-col:first-child{border-right:1px solid var(--border)}
.ft-col .col-head{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(4px);font-size:12px;color:var(--text-3);padding:4px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px;z-index:2;font-weight:600}
.ft-block{border-radius:8px;padding:4px 8px;margin:0 -8px 2px;cursor:text;transition:background .15s}
.ft-block:hover{background:#f8fafc}
.ft-block.hl-sync{background:rgba(253,230,138,.5) !important;box-shadow:inset 4px 0 0 var(--warn),0 0 0 1px rgba(245,158,11,.25) !important}
.ft-block .ft-p{font-size:14.5px;margin-bottom:10px}
.ft-col.en .ft-p{font-family:var(--serif);color:#24292f}
.ft-col.zh .ft-p{color:#374151}
.ft-col h3.ft-sec{position:sticky;top:34px;background:#fff;z-index:1;padding:8px 0 6px;margin:14px -8px 6px;font-size:15px;border-left:3px solid var(--primary);padding-left:10px}
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="index.html"><span class="mark">研</span>PaperMind</a>
  <nav class="nav">
    <a href="index.html" data-i18n="nav_discover">发现</a>
    <a href="library.html" data-i18n="nav_library">文献库</a>
    <a href="graph.html" data-i18n="nav_graph">图谱</a>
    <a href="vault.html" data-i18n="nav_vault">知识库</a>
    <a href="community.html" data-i18n="nav_community">社区交流</a>
    
  </nav>
  <div class="right">
    <button class="btn btn-primary btn-sm" onclick="location.href='library.html?tab=reader&p='+curP.id">📖 开始阅读</button>
    
    <div class="user-menu">
      <div class="avatar" id="avatarBtn">王</div>
      <div class="um-drop hidden" id="userDrop">
        <div class="um-head"><b id="umName">—</b><span id="umEmail"></span></div>
        <a href="profile.html">👤 个人中心</a>
        <a href="profile.html#edit">📝 修改资料</a>
        
        <div class="um-sep"></div>
        <a href="javascript:logout()">🚪 退出登录</a>
      </div>
    </div>
  </div>
</header>

<div class="container" style="max-width:1000px">

  <!-- 视图切换：详情 / 原文 / 翻译 -->
  <div class="view-tabs" style="margin-top:8px">
    <button class="active" id="vt-detail" onclick="switchView('detail')">📋 论文详情</button>
    <button id="vt-original" onclick="switchView('original')">🇬🇧 原文</button>
    <button id="vt-translate" onclick="switchView('translate')">🇨🇳 翻译</button>
  </div>

  <div id="viewDetail">

  <!-- 元信息 -->
  <div class="card" style="padding:26px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <span class="badge badge-blue" id="pFolder"></span>
      <span class="badge badge-purple" id="pCat"></span>
      <span class="badge badge-purple" id="pYear"></span>
      <span class="badge badge-green" id="pCites"></span>
    </div>
    <h1 style="font-size:23px;line-height:1.4" id="pTitleEn"></h1>
    <div style="color:var(--primary);font-size:15px;margin-top:6px;font-weight:500" id="pTitleZh"></div>
    <div class="intro-full" id="pIntro"></div>
    <div style="color:var(--text-2);margin-top:12px" id="pAuthors"></div>
    <div style="color:var(--text-3);margin-top:4px;font-size:13px" id="pVenue"></div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="location.href='library.html?tab=reader&p='+curP.id">📖 开始阅读</button>
      <button class="btn" id="starBtn" onclick="toggleStar()">⭐ 收藏</button>
      <button class="btn" onclick="copyCite()">📋 复制引用</button>
      <button class="btn" onclick="openIntroEdit()">✏️ 编辑简介</button>
      <a class="btn" id="pLink" target="_blank">↗ 原文链接</a>
    </div>
  </div>

  <!-- AI 总结 -->
  <div class="section-title">🤖 AI 精读总结</div>
  <div class="card" style="padding:24px">
    <div id="aiLoading" style="display:none">
      <div style="color:var(--primary);font-weight:600;margin-bottom:8px">AI 正在精读全文…</div>
      <div class="progress" style="height:8px"><i id="aiBar" style="width:0%"></i></div>
      <div style="color:var(--text-3);font-size:12px;margin-top:6px" id="aiStep">读取论文结构</div>
    </div>
    <div id="aiResult" class="hidden">
      <div style="background:var(--primary-light);border-radius:10px;padding:14px 16px;margin-bottom:14px">
        <div style="font-weight:700;color:var(--primary);margin-bottom:4px">一句话核心论点</div>
        <div id="sCore"></div>
      </div>
      <div id="sProblem" class="sum-item"></div>
      <div style="font-weight:700;margin:14px 0 6px">关键创新点</div>
      <ul id="sMethod" style="padding-left:20px"></ul>
      <div class="sum-item" id="sResult"></div>
      <div class="sum-item" id="sLimit"></div>
    </div>
    <div style="margin-top:14px;border-top:1px dashed var(--border);padding-top:12px;display:flex;gap:10px;align-items:center">
      <span style="color:var(--text-3);font-size:13px">对这篇论文有疑问？</span>
      <button class="btn btn-sm" onclick="askAI('这篇论文的核心创新是什么？')">问 AI 核心创新</button>
      <button class="btn btn-sm" onclick="askAI('这篇论文有什么局限性？')">问 AI 局限性</button>
      <span style="font-size:12px;color:var(--text-3)">→ 阅读器中支持连续追问</span>
    </div>
  </div>

  <!-- 摘要 中英对照 -->
  <div class="section-title">📄 摘要</div>
  <div class="card" style="padding:24px">
    <div style="margin-bottom:12px"><b>中文</b><div id="pAbsZh" style="color:var(--text);margin-top:4px"></div></div>
    <div style="border-top:1px dashed var(--border);padding-top:12px"><b style="color:var(--text-2)">原文</b><div id="pAbsEn" style="color:var(--text-2);margin-top:4px"></div></div>
  </div>

  <!-- 术语表 -->
  <div class="section-title">📖 关键术语表</div>
  <div class="card" style="padding:6px">
    <table class="tbl" id="glossaryTbl">
      <thead><tr><th style="width:220px">英文术语</th><th style="width:160px">中文译名</th><th>说明</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 图表 -->
  <div class="section-title">🖼 图表</div>
  <div class="card" style="padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px" id="figGrid"></div>

  <!-- 相关论文 -->
  <div class="section-title">🔗 相关论文</div>
  <div class="card" style="padding:6px" id="relatedList"></div>

  </div><!-- /viewDetail -->

  <!-- 原文视图（英文全文） -->
  <div id="viewOriginal" class="hidden"></div>

  <!-- 翻译视图（中文全文） -->
  <div id="viewTranslate" class="hidden"></div>

</div>

<!-- 简介编辑 modal -->
<div class="modal-mask" id="introModal">
  <div class="modal">
    <span class="close" onclick="closeIntroEdit()">✕</span>
    <h3>✏️ 编辑论文简介</h3>
    <div style="color:var(--text-3);font-size:12.5px;margin-bottom:10px">一句话 / 多句话均可，最长 1000 字；保存后全站卡片同步更新（卡片仍只显示 1 行，详情页看全文）。</div>
    <textarea id="introEdit" rows="7" maxlength="1000" oninput="countIntro()"
      style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;outline:none;resize:vertical;font-size:14px;line-height:1.7"></textarea>
    <div style="text-align:right;color:var(--text-3);font-size:12px;margin-top:4px"><span id="introCount">0</span> / 1000</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn" onclick="closeIntroEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveIntroEdit()">💾 保存简介</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js?v=2301"></script>
<script src="user-menu.js?v=2301"></script>
<script>
var curP = PM.papers[0];
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2200)}

(function(){
  var id = new URLSearchParams(location.search).get('p');
  if(id!=null) curP = PM.papers[Number(id)] || PM.papers[0];
  var p = curP;
  document.title = 'PaperMind';
  document.getElementById('pTitleEn').textContent = p.title;
  document.getElementById('pTitleZh').textContent = p.titleZh;
  document.getElementById('pIntro').textContent = PM.getIntro(p);
  document.getElementById('pAuthors').textContent = p.authors;
  document.getElementById('pVenue').textContent = p.venue + ' · ' + p.year + ' · DOI: ' + p.doi;
  document.getElementById('pFolder').textContent = p.status;
  document.getElementById('pFolder').className = 'badge ' + (p.status==='读完' ? 'badge-green' : p.status==='想读' ? 'badge-orange' : 'badge-blue');
  document.getElementById('pCat').textContent = p.cat || '';
  document.getElementById('pYear').textContent = p.year;
  document.getElementById('pCites').textContent = '被引 ' + (p.cites/10000).toFixed(1) + ' 万';
  document.getElementById('pLink').href = p.link;
  document.getElementById('pAbsZh').textContent = p.absZh;
  document.getElementById('pAbsEn').textContent = p.abs;
  updateStar();

  /* 术语表 */
  document.getElementById('glossaryTbl').querySelector('tbody').innerHTML = (p.glossary||[]).map(function(g){
    return '<tr><td><b>'+g[0]+'</b></td><td>'+g[1]+'</td><td style="color:var(--text-2)">'+g[2]+'</td></tr>';
  }).join('');

  /* 图表占位 */
  document.getElementById('figGrid').innerHTML = PM.figures.map(function(f,i){
    return '<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#f8fafc,#eef2f7)">'+
      '<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:40px">'+(i===0?'🏗':i===1?'🔀':'🌊')+'</div>'+
      '<div style="padding:8px 10px;font-size:12.5px;color:var(--text-2);border-top:1px solid var(--border);background:#fff">'+f+'</div></div>';
  }).join('');

  /* 相关论文 */
  document.getElementById('relatedList').innerHTML = PM.related.map(function(r){
    var idx = PM.papers.findIndex(function(x){return x.id===r[1]});
    var p2 = idx>=0 ? PM.papers[idx] : null;
    return '<div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer" onclick="'+(p2?'location.href=\'detail.html?p='+p2.id+'\'':'toast(\'演示数据，详情未收录\')')+'">'+
      '<span style="color:var(--text-3)">▸</span><span style="flex:1">'+r[0]+'</span>'+
      (p2?'<span class="badge badge-gray">'+p2.year+'</span><button class="btn btn-sm">查看</button>':'<span class="badge badge-gray">外部文献</span>')+
    '</div>';
  }).join('');

  /* AI 总结：加载动画后展示 */
  setTimeout(runAI, 400);

  /* 原文/翻译双视图 */
  renderFulltext();
})();

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

/* ============ 详情页三视图：详情 / 原文 / 翻译 ============ */
function switchView(v){
  document.getElementById('viewDetail').classList.toggle('hidden', v!=='detail');
  document.getElementById('viewOriginal').classList.toggle('hidden', v!=='original');
  document.getElementById('viewTranslate').classList.toggle('hidden', v!=='translate');
  ['detail','original','translate'].forEach(function(x){
    document.getElementById('vt-'+x).classList.toggle('active', x===v);
  });
  if(v!=='detail') setTimeout(function(){ window.scrollTo({top:0}) }, 10);
}

/* 全文渲染：原文页=中英对照双栏（选中联动高亮），翻译页=纯中文 */
function renderFulltext(){
  var hasFull = PM.readerPaper && PM.readerPaper.blocks.length && curP.id===0;
  var emptyHtml = '<div class="empty" style="padding:70px 20px"><div class="big">📄</div>'+
    '该论文全文尚未接入演示库（当前仅收录 Attention Is All You Need 全文）<br>'+
    '<button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="location.href=\'library.html?tab=reader&p='+curP.id+'\'">去阅读器体验</button></div>';

  if(!hasFull){
    document.getElementById('viewOriginal').innerHTML = emptyHtml;
    document.getElementById('viewTranslate').innerHTML = emptyHtml;
    return;
  }

  var outline = PM.readerPaper.outline;
  var secZh = {}; outline.forEach(function(o){ secZh[o.id]=o.zh });

  /* ---- 原文页：双栏 ---- */
  var enHtml = '<div class="col-head">🇬🇧 英文原文 · 选中段落，右侧翻译同步高亮</div>';
  var zhHtml = '<div class="col-head">🇨🇳 中文翻译 · 选中段落，左侧原文同步高亮</div>';
  var lastSec = '';
  PM.readerPaper.blocks.forEach(function(b,i){
    if(b.sec!==lastSec){
      enHtml += '<h3 class="ft-sec">'+(secZh[b.sec]||b.sec)+'</h3>';
      zhHtml += '<h3 class="ft-sec">'+(secZh[b.sec]||b.sec)+'</h3>';
      lastSec = b.sec;
    }
    enHtml += '<div class="ft-block" data-i="'+i+'">'+
      (b.type==='abstract'?'<span class="badge badge-blue" style="font-size:11px;margin-bottom:6px">Abstract</span>':'')+
      '<p class="ft-p">'+esc(b.en)+'</p></div>';
    zhHtml += '<div class="ft-block" data-i="'+i+'">'+
      (b.type==='abstract'?'<span class="badge badge-blue" style="font-size:11px;margin-bottom:6px">摘要</span>':'')+
      '<p class="ft-p">'+esc(b.zh)+'</p></div>';
  });
  document.getElementById('viewOriginal').innerHTML =
    '<div class="ft-duo"><div class="ft-col en" id="ftColEn">'+enHtml+'</div><div class="ft-col zh" id="ftColZh">'+zhHtml+'</div></div>';

  /* ---- 翻译页：纯中文 ---- */
  var zhOnly = '';
  lastSec='';
  PM.readerPaper.blocks.forEach(function(b){
    if(b.sec!==lastSec){
      zhOnly += '<h3 class="ft-sec">'+(secZh[b.sec]||b.sec)+'</h3>';
      lastSec = b.sec;
    }
    zhOnly += (b.type==='abstract'?'<div class="ft-abs">':'')+
      '<p class="ft-p">'+esc(b.zh)+'</p>'+
      (b.type==='abstract'?'</div>':'');
  });
  document.getElementById('viewTranslate').innerHTML =
    '<div class="fulltext zh"><div class="ft-title">'+esc(curP.titleZh)+'</div>'+
    '<div class="ft-meta">'+esc(curP.title)+' · '+esc(curP.venue)+' · AI 全文翻译</div>'+zhOnly+'</div>';

  bindDuo();
}

/* 双栏联动：同步滚动 + 选中段落双向高亮 */
function bindDuo(){
  var colEn = document.getElementById('ftColEn');
  var colZh = document.getElementById('ftColZh');
  var syncing = false;

  function syncScroll(from, to){
    if(syncing) return;
    syncing = true;
    var maxF = from.scrollHeight - from.clientHeight;
    var maxT = to.scrollHeight - to.clientHeight;
    to.scrollTop = maxT>0 ? from.scrollTop/maxF*maxT : 0;
    syncing = false;
  }
  colEn.addEventListener('scroll', function(){ syncScroll(colEn, colZh) });
  colZh.addEventListener('scroll', function(){ syncScroll(colZh, colEn) });

  var activeI = -1;
  function highlightPair(i){
    if(i===activeI) return;
    activeI = i;
    document.querySelectorAll('#viewOriginal .ft-block').forEach(function(el){
      el.classList.toggle('hl-sync', Number(el.dataset.i)===i);
    });
  }
  function blockOfNode(node){
    var el = node && node.nodeType===3 ? node.parentElement : node;
    return el && el.closest ? el.closest('.ft-block') : null;
  }
  function onSelect(){
    setTimeout(function(){
      var sel = window.getSelection();
      if(!sel || sel.isCollapsed){ return }
      var b = blockOfNode(sel.anchorNode) || blockOfNode(sel.focusNode);
      if(b) highlightPair(Number(b.dataset.i));
    }, 10);
  }
  /* 鼠标选中（划选）触发双向高亮 */
  colEn.addEventListener('mouseup', onSelect);
  colZh.addEventListener('mouseup', onSelect);
  /* 点击段落也联动（无选区时） */
  function onClick(e){
    if(!window.getSelection().isCollapsed) return;
    var b = e.target.closest('.ft-block');
    if(b) highlightPair(Number(b.dataset.i));
  }
  colEn.addEventListener('click', onClick);
  colZh.addEventListener('click', onClick);
}

function updateStar(){
  document.getElementById('starBtn').innerHTML = curP.starred ? '⭐ 已收藏' : '☆ 收藏';
}
function toggleStar(){curP.starred=!curP.starred;updateStar();toast(curP.starred?'已收藏':'已取消收藏')}

/* ============ 简介编辑（1000 字，保存后全站同步） ============ */
function openIntroEdit(){
  document.getElementById('introEdit').value = PM.getIntro(curP);
  countIntro();
  document.getElementById('introModal').classList.add('show');
  setTimeout(function(){ document.getElementById('introEdit').focus() }, 100);
}
function closeIntroEdit(){ document.getElementById('introModal').classList.remove('show') }
function countIntro(){ document.getElementById('introCount').textContent = document.getElementById('introEdit').value.length }
function saveIntroEdit(){
  var t = document.getElementById('introEdit').value.trim();
  if(!t){ toast('简介不能为空'); return }
  PM.setIntro(curP.id, t);
  document.getElementById('pIntro').textContent = t;
  closeIntroEdit();
  toast('✅ 简介已保存（'+t.length+' 字，全站卡片同步生效）');
}
function copyCite(){
  var txt = curP.authors.split(',')[0]+' et al. "'+curP.title+'" ('+curP.year+').';
  navigator.clipboard && navigator.clipboard.writeText(txt);
  toast('已复制引用：'+txt.slice(0,40)+'…');
}

/* AI 总结生成动画（setTimeout 模拟流式） */
var aiSteps = [
  [0,'读取论文结构与元数据…'],
  [35,'解析摘要与引言…'],
  [60,'提炼方法与关键创新…'],
  [85,'汇总实验结果与局限…']
];
function runAI(){
  var load=document.getElementById('aiLoading'),bar=document.getElementById('aiBar'),step=document.getElementById('aiStep');
  load.style.display='block';step.textContent=aiSteps[0][1];bar.style.width='0%';
  var i=0;
  var timer=setInterval(function(){
    i++;
    if(i<aiSteps.length){bar.style.width=aiSteps[i][0]+'%';step.textContent=aiSteps[i][1]}
    else{
      clearInterval(timer);bar.style.width='100%';
      setTimeout(function(){load.style.display='none';showResult()},300);
    }
  },500);
}
function showResult(){
  var s=curP.summary;
  document.getElementById('aiResult').classList.remove('hidden');
  document.getElementById('sCore').textContent=s.core;
  var item=function(label,val){return '<div class="sum-item" style="margin-top:10px"><b>'+label+'：</b>'+val+'</div>'};
  document.getElementById('sProblem').innerHTML=item('研究问题',s.problem);
  document.getElementById('sMethod').innerHTML=s.method.map(function(m){return '<li>'+m+'</li>'}).join('');
  document.getElementById('sResult').innerHTML=item('主要结果',s.result);
  document.getElementById('sLimit').innerHTML=item('结论与局限',s.limit);
}
