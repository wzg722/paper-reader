# PaperMind — Docker Compose（Linux / Windows Docker Desktop）
# 用法：
#   cp .env.example .env   # 填写 DEEPSEEK_API_KEY
#   docker compose up -d --build
# 访问：http://localhost

services:
  mysql:
    image: mysql:8.0
    container_name: pm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-papermind}
      MYSQL_USER: ${DB_USER:-papermind}
      MYSQL_PASSWORD: ${DB_PASSWORD:-papermind123}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ocr:
    build:
      context: ./deploy/ocr
      dockerfile: Dockerfile
    container_name: pm-ocr
    restart: unless-stopped
    ports:
      - "8866:8866"
    environment:
      OCR_LANG: ch
    # GPU（可选，Linux + nvidia-container-toolkit）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "False"
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-papermind}
      DB_USER: ${DB_USER:-papermind}
      DB_PASSWORD: ${DB_PASSWORD:-papermind123}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      OCR_SERVICE_URL: http://ocr:8866
      MEDIA_ROOT: /app/media
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ocr:
        condition: service_started
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 4 --timeout 120"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm-celery
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: mysql
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-papermind}
      DB_USER: ${DB_USER:-papermind}
      DB_PASSWORD: ${DB_PASSWORD:-papermind123}
      CELERY_BROKER_URL: redis://redis:6379/1
      OCR_SERVICE_URL: http://ocr:8866
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
    depends_on:
      - backend
      - redis
    command: celery -A config worker -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    depends_on:
      - backend
      - frontend

volumes:
  mysql_data:
  redis_data:
  media_data:
  static_data:
